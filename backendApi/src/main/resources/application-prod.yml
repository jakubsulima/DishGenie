server:
  address: 0.0.0.0
  port: ${PORT:8080}
  servlet:
    context-path: /api # Use environment variable for cloud deployment
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate # Never use 'update' in production
    show-sql: false # Disable SQL logging
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web: WARN
    org.jakub.backendapi: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

oauth:
  google:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

allowed:
  origins: ${ALLOWED_ORIGINS:http://localhost:3000}

security:
  trusted-proxy-ips: ${TRUSTED_PROXY_IPS:}
  jwt:
    token:
      secret-key: ${JWT_SECRET_KEY}
    cookie:
      secure: ${JWT_COOKIE_SECURE:true}
      same-site: ${JWT_COOKIE_SAME_SITE:Lax}

app:
  frontend-url: ${FRONTEND_URL}
  limits:
    generate-recipe-requests-per-minute: ${GENERATE_RECIPE_LIMIT_PER_MINUTE:15}
    recipe-requests-per-day:
      free: ${FREE_PLAN_RECIPE_REQUESTS_PER_DAY:${FREE_PLAN_RECIPE_LIMIT:75}}
      paid: ${PAID_PLAN_RECIPE_REQUESTS_PER_DAY:${PAID_PLAN_RECIPE_LIMIT:-1}}

posthog:
  enabled: ${POSTHOG_ENABLED:false}
  host: ${POSTHOG_HOST:https://eu.i.posthog.com}
  project-key: ${POSTHOG_PROJECT_KEY:}
  connect-timeout-ms: ${POSTHOG_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${POSTHOG_READ_TIMEOUT_MS:5000}
