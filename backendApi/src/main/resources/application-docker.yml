spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 22
    validate-on-migrate: true

gemini:
  api:
    model: ${GEMINI_API_MODEL:gemini-3.5-flash-lite}
    fallback-model: ${GEMINI_API_FALLBACK_MODEL:}
