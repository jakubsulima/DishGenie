plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'pmd'
}

group = 'org.jakub' // use all lowercase to match folder structure
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Security fixes newer than the Spring Boot dependency BOM.
ext['jackson-2-bom.version'] = '2.21.8'
ext['log4j2.version'] = '2.26.1'
ext['postgresql.version'] = '42.7.14'

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.postgresql:postgresql'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.genai:google-genai:1.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'com.h2database:h2'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.withType(JavaCompile) {
    options.annotationProcessorPath = configurations.annotationProcessor
    options.compilerArgs += ['-parameters']
}

tasks.withType(Test).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

springBoot {
    mainClass = 'org.jakub.backendapi.BackendApiApplication'
}

// Docker dev compilation can temporarily delete classes before recreating them.
// Signal DevTools only after classes AND resources have finished successfully.
// Keep the signal outside compiler outputs so their cleanup cannot trigger it.
def devReloadDir = providers.gradleProperty('devReloadDir')
if (devReloadDir.isPresent()) {
    def signalDirectory = file(devReloadDir.get())
    tasks.register('devClasses') {
        dependsOn tasks.named('classes')
        doLast {
            signalDirectory.mkdirs()
            new File(signalDirectory, '.reloadtrigger').text = System.currentTimeMillis().toString()
        }
    }
    tasks.named('bootRun') {
        classpath += files(signalDirectory)
        systemProperty 'spring.devtools.restart.trigger-file', '.reloadtrigger'
    }
}

test {
    useJUnitPlatform()
    // The smoke harness launches Vite/Playwright; its inputs also live outside Java.
    // An explicit opt-in always means a fresh browser/API/database verification.
    def browserPlannerSmoke = System.getenv('RUN_BROWSER_PLANNER_SMOKE') ?: '0'
    inputs.property('runBrowserPlannerSmoke', browserPlannerSmoke)
    if (browserPlannerSmoke == '1') outputs.upToDateWhen { false }
    def livePriceSmoke = System.getenv('RUN_LIVE_PRICE_SMOKE') ?: '0'
    inputs.property('runLivePriceSmoke', livePriceSmoke)
    if (livePriceSmoke == '1') outputs.upToDateWhen { false }
}

pmd {
    consoleOutput = true
    ruleSets = []
    ruleSetFiles = files("${rootDir}/config/pmd/unused-code.xml")
}

tasks.withType(Pmd).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('unusedJava') {
    group = 'verification'
    description = 'Runs PMD rules that flag unused Java code in src/main.'
    dependsOn tasks.named('pmdMain')
}
